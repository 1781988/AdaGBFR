[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adagbfr"
version = "0.1.0"
description = "Adaptive dynamic and budget-aware graph-bounded financial reasoning"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["adagbfr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
