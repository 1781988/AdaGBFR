llm:
  enabled: true
  model: qwen3-14b
  base_url: http://127.0.0.1:8000/v1
  api_key_env: OPENAI_API_KEY
  temperature: 0.0
  timeout: 120
knowledge_base:
  path: data/gbfr/fmkg.json
reasoning:
  max_depth: 6
  enable_early_stop: true
  early_stop_confidence: 0.97
  near_tie_margin: 0.08
  consistency_rtol: 0.0001
  consistency_atol: 1.0e-8
  evidence:
    use_llm_fallback: true
  dynamic:
    enabled: true
    source_path: data/gbfr/source_corpus.jsonl
    top_k_sources: 5
    min_source_score: 0.0
    min_confidence: 0.84
    min_sources: 1
    allow_rule_parser: true
    use_llm_fallback: true
    promotion_log: logs/dynamic_candidates.jsonl
  path:
    max_paths_per_metric: 3
    min_path_score: -0.05
    w_evidence: 0.52
    w_trust: 0.28
    w_depth: 0.10
    w_cost: 0.10
  verification:
    mode: adaptive
    deterministic_confidence: 0.97
    dynamic_requires_llm: true
  budget:
    max_llm_calls: 24
    max_total_tokens: 16000
    max_cost_usd: 0.25
    max_paths_total: 12
    input_price_per_million: 0.0
    output_price_per_million: 0.0
